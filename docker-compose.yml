services:
  postgres:
    image: postgres:16-alpine
    container_name: inventorymdb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: inventorymdb
      POSTGRES_PASSWORD: inventorymdb
      POSTGRES_DB: inventorymdb
    ports:
      - '5432:5432'
    volumes:
      - inventorymdb_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U inventorymdb -d inventorymdb']
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: inventorymdb-pgadmin
    restart: unless-stopped
    profiles: ['tools']
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@inventorymdb.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    depends_on:
      - postgres

volumes:
  inventorymdb_pg_data:
